name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install reportlab xlrd openpyxl pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          if (Test-Path logo.png) {
            pyinstaller --onefile --noconsole --add-data "logo.png;." --name EloxLabels elox_labels.py
          } else {
            pyinstaller --onefile --noconsole --name EloxLabels elox_labels.py
          }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: EloxLabels
          path: dist/EloxLabels.exe
          retention-days: 90
